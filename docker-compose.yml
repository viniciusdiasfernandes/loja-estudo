services:
  postgres:
    image: postgres:18.6
    container_name: loja-postgres
    environment:
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: loja
      POSTGRES_DB: loja_catalog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loja -d loja_catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: