services:
  postgres:
    image: postgres:18.6
    container_name: loja-postgres
    environment:
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: loja
      POSTGRES_DB: loja_catalog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loja -d loja_catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: loja-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: loja
      RABBITMQ_DEFAULT_PASS: loja
    ports:
      - "5672:5672"     # porta que o código usa
      - "15672:15672"   # painel web
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  rabbitmqdata: